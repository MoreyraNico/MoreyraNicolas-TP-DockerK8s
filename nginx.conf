events {}

http {
    # DNS interno de Docker para balancear dinámicamente entre réplicas
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        # 1. Tráfico hacia el Frontend (2 réplicas de Flask)
        location / {
            set $frontend_upstream http://frontend:5000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Tráfico hacia el Backend (2 réplicas de FastAPI)
        location /api/ {
            set $backend_upstream http://backend:8000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
