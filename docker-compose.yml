services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: usuarios_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d usuarios_db"]
      interval: 2s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: on-failure
    deploy:
      replicas: 2
    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin123@db:5432/usuarios_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: on-failure
    deploy:
      replicas: 2
    environment:
      BACKEND_URL: /api
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
